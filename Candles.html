<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Rory's_BTD_Candles</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    h2 {
      margin-bottom: 35px;
      font-weight: 500;
      text-align: center;
      z-index: 2;
    }

    /* حاوية 20 شمعة بشكل منسق */
    .candles-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px 28px;
      max-width: 760px;
      align-items: flex-end;
      z-index: 2;
    }

    /* جسم الشمعة */
    .candle {
      position: relative;
      width: 20px;
      height: 75px;
      border-radius: 6px 6px 3px 3px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }

    .candle:hover {
      transform: scale(1.08);
    }

    /* الفتيل */
    .wick {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 2.5px;
      height: 9px;
      background: #333;
      border-radius: 2px;
    }

    /* الشعلة */
    .flame {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #fff, #ffeb3b 40%, #ff9800 80%, transparent);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 18px #ff9800, 0 0 35px #ff5722;
      animation: flicker 0.15s infinite alternate;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* حالة الإطفاء */
    .candle.blown-out .flame {
      opacity: 0;
      transform: translateX(-50%) scale(0);
      pointer-events: none;
    }

    /* دخان بسيط عند الإطفاء */
    .smoke {
      position: absolute;
      top: -22px;
      left: 50%;
      width: 7px;
      height: 7px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .candle.blown-out .smoke {
      animation: riseSmoke 1.2s ease-out forwards;
    }

    /* رسالة النهاية */
    #celebration-msg {
      margin-top: 35px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd166;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.5s ease;
      text-align: center;
      z-index: 2;
    }

    #celebration-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* كانفاس الفرقعة */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.05, 0.95) rotate(2deg); }
    }

    @keyframes riseSmoke {
      0% { opacity: 0.7; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-30%, -45px) scale(2.5); }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <h2 id="instruction">دوسي على الشموع عشان تطفيها (0 / 20) 🕯️</h2>

  <div class="candles-container" id="candles"></div>

  <div id="celebration-msg">🎉 كل سنة وانتي طيبة يارورييييعععععع 🎉</div>

  <!-- غيّر اسم الملف song.mp3 لاسم الأغنية بتاعتك -->
  <audio id="birthday-song" src="hazybazy.mp3" preload="auto"></audio>

  <script>
    const CANDLES_COUNT = 20;
    const container = document.getElementById('candles');
    const msg = document.getElementById('celebration-msg');
    const instruction = document.getElementById('instruction');
    const song = document.getElementById('birthday-song');

    const palettes = [
      'linear-gradient(to right, #f8b500, #fceabb)',
      'linear-gradient(to right, #ff6b6b, #ff9e9e)',
      'linear-gradient(to right, #4ecdc4, #88f7ef)',
      'linear-gradient(to right, #a29bfe, #d6d2ff)',
      'linear-gradient(to right, #ff9f43, #ffd8a8)'
    ];

    let blownCount = 0;
    let celebrated = false;

    // إنشاء 20 شمعة تلقائياً
    for (let i = 0; i < CANDLES_COUNT; i++) {
      const candle = document.createElement('div');
      candle.className = 'candle';
      candle.style.background = palettes[i % palettes.length];
      candle.style.height = `${68 + (i % 4) * 8}px`;

      candle.innerHTML = `
        <div class="wick"></div>
        <div class="flame"></div>
        <div class="smoke"></div>
      `;

      candle.addEventListener('click', () => {
        if (!candle.classList.contains('blown-out')) {
          candle.classList.add('blown-out');
          blownCount++;
          instruction.textContent = `اضغط على الشموع لإطفائها (${blownCount} / ${CANDLES_COUNT}) 🕯️`;

          if (blownCount === CANDLES_COUNT && !celebrated) {
            celebrated = true;
            instruction.textContent = "تم إطفاء جميع الشموع ✨";
            msg.classList.add('show');
            triggerFireworks();
            playSong();
          }
        }
      });

      container.appendChild(candle);
    }

    function playSong() {
      song.currentTime = 0;
      song.play().catch(() => {
        console.warn("تعذر تشغيل الأغنية تلقائياً، تأكد من مسار الملف أو اسم الأغنية.");
      });
    }

    // كود تأثير الفرقعة (Confetti Burst)
    function triggerFireworks() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ff6b6b', '#ffd166', '#4ecdc4', '#a29bfe', '#ff9f43', '#ffffff'];

      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.25,
          drag: 0.96,
          alpha: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = false;

        particles.forEach(p => {
          if (p.alpha > 0.01) {
            activeParticles = true;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.012;

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });

        if (activeParticles) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>

</body>
</html>
